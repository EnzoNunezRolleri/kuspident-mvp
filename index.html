<style>
/* Layout: sticky header, search band, single column of dentist cards (info left, agenda right), booking view swaps in place */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --card:#F3FBFD; --card-line:#CDE8F2; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace; --line:#DCEAF5; --fg:#0E2236; --muted:#4B6278;
  --accent:#0A72C6; --accent-ink:#FFFFFF; --accent-soft:#E5F4FE;
  --slot:#E2F2FD; --slot-fg:#045A9A; --slot-hover:#C9E7FB;
  --star:#2F8FD3; --band:#E3F4FE; --band-2:#C9EAFC; --band-fg:#0E2236; --band-muted:#3E5A73;
  --danger:#B42318; --shadow:0 1px 2px rgba(14,34,54,.05),0 10px 30px rgba(10,114,198,.10);
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#FFFFFF;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--accent);text-decoration:none;background:none;border:0;padding:0}
.logo img{width:34px;height:34px;display:block}
nav.links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav.links a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:500}
nav.links a:hover{color:var(--fg);background:var(--accent-soft)}
nav.links .btn-ghost{border:1px solid var(--line);color:var(--fg)}
@media (max-width:720px){nav.links .hide-sm{display:none}}

/* hero */
.band{background:linear-gradient(180deg,var(--accent-soft) 0%,var(--bg) 220px);color:var(--fg)}
.band .wrap{padding-block:48px 40px;display:flex;flex-direction:column;gap:26px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.band h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.2vw,72px);line-height:1;letter-spacing:-.045em;margin:0;max-width:13ch;text-wrap:balance}
.band p{margin:0;color:var(--muted);font-size:clamp(17px,1.6vw,21px);line-height:1.6;max-width:36ch}
.search{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1000px;margin-top:8px}
.search .sel{position:relative;min-width:0}
.search select{appearance:none;-webkit-appearance:none;width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 44px 14px 20px;font-size:16.5px;color:var(--fg);min-height:52px;cursor:pointer;transition:border-color .15s}
.search select:hover{border-color:var(--accent)}
.search select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search select:disabled{color:var(--muted);cursor:not-allowed;opacity:.8}
.search svg{position:absolute;right:16px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
@media (max-width:760px){.search{grid-template-columns:1fr}}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 24px;font-weight:700;font-size:15px;min-height:48px;box-shadow:0 6px 16px rgba(10,114,198,.25);transition:transform .15s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:progress}

/* results */
main{padding-block:12px 64px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.toolbar .count{color:var(--muted);font-size:14px}
.sort{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sort select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--fg)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:30px;box-shadow:0 10px 30px -18px rgba(10,114,198,.25);transition:box-shadow .2s}
.card:hover{box-shadow:0 18px 40px -18px rgba(10,114,198,.35)}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}}
.card-main{display:flex;flex-wrap:wrap;gap:28px}
.info{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:18px;align-items:flex-start}
.portrait{width:104px;height:104px;border-radius:14px;flex:none;overflow:hidden;background:var(--accent-soft)}
.portrait svg,.portrait img{display:block;width:100%;height:100%;object-fit:cover}
.who h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who h3 button{all:unset;cursor:pointer}
.who h3 button:hover{text-decoration:underline}
.verified{width:20px;height:20px;color:var(--accent);flex:none}
.spec{color:var(--muted);margin:2px 0 6px}
.rating{display:flex;align-items:center;gap:8px;font-size:14px}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.rating .num{font-weight:700}
.rating button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}
.meta{display:flex;flex-direction:column;gap:8px;font-size:15px}
.meta .row{display:flex;gap:10px;align-items:flex-start}
.meta svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--muted)}
.meta .sub{color:var(--muted);font-size:14px}
.tagline{display:flex;gap:8px;align-items:flex-start}
.tagline mark{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px;font-weight:600}
.insur{display:flex;gap:6px;flex-wrap:wrap}
.insur span{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}

.agenda{flex:1 1 340px;min-width:0}
.agenda-head{display:grid;grid-template-columns:36px repeat(3,minmax(0,1fr)) 36px;align-items:center;gap:8px;margin-bottom:10px}
.day{text-align:center;line-height:1.25}
.day b{display:block;font-size:15px}
.day small{color:var(--muted);font-size:13.5px}
.arrow{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.arrow svg{width:16px;height:16px}
.arrow[disabled]{opacity:.35;cursor:default}
.slots{display:grid;grid-template-columns:36px repeat(3,minmax(0,1fr)) 36px;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.col:first-child{grid-column:2}
.slot{background:var(--slot);color:var(--slot-fg);border:0;border-radius:999px;transition:background .15s;min-height:44px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.slot:hover{background:var(--slot-hover)}
.none{color:var(--muted);text-align:center;font-size:13px;padding:12px 4px;border:1px dashed var(--line);border-radius:12px}
.more{display:block;margin:12px auto 0;background:none;border:0;color:var(--fg);font-weight:600;padding:8px}
.more svg{width:14px;height:14px;vertical-align:-2px;margin-left:4px}

.reviews{border-top:1px solid var(--line);margin-top:22px;padding-top:20px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
@media (max-width:720px){.reviews{grid-template-columns:1fr}}
.summary .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.summary small{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:13px;color:var(--muted)}
.bars div{display:grid;grid-template-columns:14px 1fr 30px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bars i{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bars i::after{content:"";display:block;height:100%;width:var(--w);background:var(--star)}
.rlist{display:flex;flex-direction:column;gap:18px}
.review header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.review header b{font-weight:600}
.review header small{color:var(--muted)}
.review p{margin:6px 0 0;max-width:68ch}
.review .stars svg{width:14px;height:14px}
.review .tag{font-size:12.5px;color:var(--muted);margin-top:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:32px;text-align:center;color:var(--muted)}

/* booking */
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center;margin-bottom:12px}
.back svg{width:16px;height:16px}
.book{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.form{flex:999 1 480px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.form h2{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.015em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field .hint{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:0}
.side{flex:1 1 320px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px;position:sticky;top:90px}
.side .who .portrait{width:72px;height:72px;border-radius:12px}
.side .who h3{font-size:17px}
.when{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.when b{font-size:17px;text-transform:capitalize}
.when span{color:var(--muted);font-size:14px}
.lines{display:flex;flex-direction:column;gap:10px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines span{color:var(--muted)}
.lines b{text-align:right}
.policy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,18,14,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:24px;max-width:500px;width:100%;padding:32px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dialog{animation:none}}
.dialog .badge{align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.dialog h2{font-family:var(--display);font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.dialog p{margin:0;color:var(--muted)}
.dialog ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block;vertical-align:-5px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
footer .cols{display:flex;gap:28px;flex-wrap:wrap}
</style>

function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}

  const dt=dayDate(off),wd=dt.getDay();

function breakdown(d){
  const five=Math.round(d.count*(d.rating-3.9)/1.15),four=Math.round((d.count-five)*0.7),three=Math.max(0,d.count-five-four-1),two=d.count-five-four-three>0?1:0;
  const rows=[[5,five],[4,four],[3,three],[2,two],[1,0]];
  return rows.map(([s,n])=>`<div><span>${s}</span><i style="--w:${Math.round(n/d.count*100)}%"></i><span>${n}</span></div>`).join('');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');
  if(!t) return;
  if(t.hasAttribute('data-noop')){e.preventDefault();return;}
  const ds=t.dataset;
  if(ds.book){const[id,off,time]=ds.book.split('|');track('click_hora',{...DN(id),dia:+off,hora:time});state.booking={id:+id,off:+off,time};state.form.motivo='';state.error='';state.view='book';render();return;}
  if(ds.next){track('ver_mas_dias',DN(ds.next));state.offsets[ds.next]=(state.offsets[ds.next]||0)+3;render(true);return;}
  if(ds.prev){state.offsets[ds.prev]=Math.max(0,(state.offsets[ds.prev]||0)-3);render(true);return;}
  if(ds.more){track('mostrar_mas_horas',DN(ds.more));state.expanded[ds.more]=!state.expanded[ds.more];render(true);return;}
  if(ds.rev){if(!state.open[ds.rev])track('ver_opiniones',DN(ds.rev));state.open[ds.rev]=!state.open[ds.rev];render(true);return;}
  if(ds.only!==undefined){track('filtro_rapido',{filtro:ds.only});state.only=state.only===ds.only?'':ds.only;render(true);return;}
  if(t.id==='back'){track('volver_desde_reserva');state.view='list';render();return;}
  if(t.id==='home'){state.view='list';state.region='todas';state.comuna='todas';state.spec='todas';state.only='';render();return;}
  if(t.id==='close-mvp'){track('cerrar_aviso_mvp');$('#modal').innerHTML='';state.view='list';state.form={name:'',rut:'',phone:'',email:'',prev:'Fonasa',motivo:'',first:true};render();return;}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='f-region'){track('filtro_region',{region:e.target.value});state.region=e.target.value;state.comuna='todas';render(true);}
  else if(id==='f-comuna'){track('filtro_comuna',{comuna:e.target.value});state.comuna=e.target.value;render(true);}
  else if(id==='f-spec'){track('filtro_especialidad',{especialidad:e.target.value});state.spec=e.target.value;render(true);}
  else if(id==='f-sort'){track('ordenar',{orden:e.target.value});state.sort=e.target.value;render(true);}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='search'){const r=$('#results');if(r) r.scrollIntoView({behavior:'smooth'});return;}
  if(e.target.id==='bookform'){
    const f=state.form;
    f.name=$('#b-name').value.trim();f.rut=$('#b-rut').value.trim();f.phone=$('#b-phone').value.trim();f.email=$('#b-email').value.trim();
    f.prev=$('#b-prev').value;f.motivo=$('#b-motivo').value;f.first=$('#b-first').checked;
    let err='';
    if(f.name.split(/\s+/).length<2) err='Escribe tu nombre y apellido.';
    else if(f.rut.replace(/[^0-9kK]/g,'').length<8) err='Revisa tu RUT. Debe tener formato 12.345.678-9.';
    else if(f.phone.replace(/\D/g,'').length<8) err='Ingresa un teléfono de al menos 8 dígitos.';
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) err='Ingresa un correo válido, por ejemplo nombre@gmail.com.';
    else if(!$('#b-terms').checked) err='Debes aceptar los términos para confirmar.';
    if(err){track('error_formulario',{error:err});state.error=err;render(true);const el=document.querySelector('.err');if(el) el.scrollIntoView({block:'center'});return;}
    state.error='';
    track('confirmar_cita',{...DN(state.booking.id),prevision:f.prev,motivo:f.motivo,primera_vez:f.first});
    saveBooking(f);
    const btn=$('#confirm');btn.disabled=true;btn.innerHTML='<span class="spinner" aria-hidden="true"></span>Confirmando tu hora…';
    setTimeout(showMVP,1400);
  }
});
/* Guarda cada reserva (nombre, teléfono, correo y la hora elegida; nunca el RUT) en Google Sheets */
const SHEETS_URL='https://script.google.com/macros/s/AKfycbyHGgkIFtHRsYlVdPJFNuIYEsKd_5h0hYH71W39UdPgINwp5AUkeaJenPPHp3Dmwece/exec';
function saveBooking(f){
  try{
    if(!/^https:\/\/script\.google\.com\//.test(SHEETS_URL)) return;
    const b=state.booking,d=D.find(x=>x.id===b.id),dt=dayDate(b.off);
    const data={tipo:'reserva',visita:VISITA,nombre:f.name,telefono:f.phone,correo:f.email,dentista:d.name,especialidad:d.spec,comuna:d.comuna,region:d.region==='santiago'?'Santiago':'Concepción',
      fecha_cita:`${WDL[dt.getDay()]} ${dt.getDate()} de ${MONTHS[dt.getMonth()]}`,hora:b.time,prevision:f.prev,motivo:f.motivo,primera_vez:f.first?'Sí':'No'};
    fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data).toString()}).catch(()=>{});
  }catch(e){}
}
function showMVP(){
  track('vio_aviso_mvp',DN(state.booking.id));
  const first=state.form.name.split(/\s+/)[0]||'';
  $('#modal').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="mvp-t">
    <div class="dialog">
      <span class="badge">Prototipo · MVP</span>
      <h2 id="mvp-t">Gracias${first?', '+first:''}. Esta hora no fue agendada.</h2>
      <p>Kuspident todavía está en desarrollo y esta página es un MVP para validar la idea. Los dentistas, opiniones y horarios que viste son de ejemplo.</p>
      <ul><li>No se reservó ninguna cita.</li><li>Guardamos tu nombre, teléfono y correo solo para avisarte cuando Kuspident esté disponible. Tu RUT no se guardó. Si prefieres que borremos tus datos, solo pídelo cuando te contactemos.</li><li>Si necesitas atención, agenda directamente con tu dentista o centro de salud.</li></ul>
      <p>Tu interés nos ayuda mucho a saber si construir Kuspident vale la pena.</p>
      <button class="btn" type="button" id="close-mvp">Entendido, volver al inicio</button>
    </div></div>`;
  $('#close-mvp').focus();
}
render();
track('vio_pagina');
})();
</script>
